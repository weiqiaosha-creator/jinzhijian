<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 300px; padding: 14px; font-family: -apple-system,"PingFang SC",sans-serif; font-size: 13px; color:#2b3a4a; }
    h3 { margin: 0 0 10px; font-size: 14px; color:#00A86B; display:flex; justify-content:space-between; align-items:center; }
    .ver { font-size: 11px; color:#8a93a0; font-weight:400; }
    label { display:block; color:#8a93a0; margin: 8px 0 4px; }
    input { width: 100%; padding: 7px; border: 1px solid #e3e6ea; border-radius: 7px; box-sizing: border-box; }
    .row { display:flex; gap:8px; margin-top:12px; }
    button { flex:1; padding: 8px; border: none; border-radius: 7px; background:#00A86B; color:#fff; font-weight: 600; cursor: pointer; font-size:13px; }
    button.ghost { background:#eef1f5; color:#2b3a4a; }
    .hint { color:#8a93a0; font-size: 11px; line-height: 1.7; margin-top: 10px; }
    .sponsor { color:#8a93a0; font-size: 11px; line-height: 1.7; margin-top: 8px; }
    .sponsor a { color:#00A86B; }
    .sponsor-btn-row { display:flex; gap:8px; margin-top: 12px; }
    .sponsor-btn-row button { flex:1; padding:7px; border-radius:7px; font-weight:600; font-size:12px; border:1px solid transparent; cursor:pointer; }
    .btn-wechat { background:#fff; color:#07c160; border:1px solid #07c160 !important; }
    .btn-wechat:hover { background:#e8f9ef; }
    .btn-afdian { background:#3B82F6; color:#fff; }
    .btn-afdian:hover { background:#2563EB; }
    #reward-mask { display:none; position:fixed; inset:0; background:rgba(0,0,0,.62); z-index:9999; align-items:center; justify-content:center; flex-direction:column; gap:10px; }
    #reward-mask.on { display:flex; }
    #reward-box { background:#fff; padding:16px 16px 12px; border-radius:12px; text-align:center; max-width:92%; }
    #reward-box h4 { margin:0 0 10px; color:#07c160; font-size:14px; }
    #reward-box img { width:260px; height:260px; object-fit:contain; border-radius:8px; background:#fafafa; }
    #reward-box p { margin:10px 0 0; font-size:12px; color:#8a93a0; line-height:1.6; }
    #reward-close { margin-top:4px; padding:6px 14px; border:none; border-radius:7px; background:#eef1f5; color:#2b3a4a; cursor:pointer; font-size:12px; }
    #st { font-size: 12px; margin-top: 8px; min-height: 14px; }
  </style>
</head>
<body>
  <h3>瑾之笺·稳定版 · 凭证 <span class="ver" id="ver">v2.0.2</span></h3>
  <label>AppID</label>
  <input id="appid" placeholder="公众号 AppID" />
  <label>AppSecret</label>
  <input id="secret" type="password" placeholder="AppSecret" />
  <div class="row">
    <button id="save">保存</button>
    <button id="test" class="ghost">测试连接</button>
  </div>
  <div id="st"></div>
  <p class="hint">凭证仅存浏览器本地 storage，不上传任何第三方。推送前需把本机出口 IP 加入公众号 IP 白名单（开发→基本配置）。<br><b>个人订阅号</b>无群发 API：在编辑器页右下角面板选「个人号」并填定时时间，本插件会在到点自动打开后台发表（需保持登录）。</p>
  <p class="sponsor">开源免费 · 赞助持续维护：<a href="https://afdian.com/a/qiaoshan95236" target="_blank">爱发电</a> ｜ <a href="https://github.com/weiqiaosha-creator/jinzhijian" target="_blank">GitHub</a></p>
  <div class="sponsor-btn-row">
    <button class="btn-wechat" id="btn-wechat">💚 微信赞赏</button>
    <button class="btn-afdian" onclick="window.open('https://afdian.com/a/qiaoshan95236','_blank')">💙 爱发电</button>
  </div>
  <div id="reward-mask" onclick="if(event.target===this)document.getElementById('reward-mask').classList.remove('on')">
    <div id="reward-box">
      <h4>感谢支持瑾之笺 · 微信赞赏</h4>
      <img id="reward-img" src="images/wechat-reward.png" alt="微信赞赏码"
           onerror="this.onerror=null;this.style.border='2px dashed #e3e6ea';this.parentNode.querySelector('p.tip').innerHTML='⚠️ 尚未放入赞赏码图片，<br>请把图片保存为 <b>images/wechat-reward.png</b> 后重新加载扩展。'" />
      <p class="tip">长按或扫码支持作者 ✨</p>
      <button id="reward-close" onclick="document.getElementById('reward-mask').classList.remove('on')">关闭</button>
    </div>
  </div>
  <script src="popup.js"></script>
  <script>
    document.getElementById('btn-wechat').addEventListener('click', function () {
      document.getElementById('reward-mask').classList.add('on');
    });
  </script>
</body>
</html>
